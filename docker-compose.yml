services:
  masyg-extractor-app:
    build:
      context: .            # was: ./app
      dockerfile: Dockerfile
    container_name: masyg-extractor-app
    env_file: .env
    restart: unless-stopped
    networks: [public]
    ports: ["5000:5000"]    # publish to host; remove if you use a reverse proxy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  public:
    external: true
