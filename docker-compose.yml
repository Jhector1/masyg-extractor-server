services:
  masyg-extractor-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: masyg-extractor-app
    env_file: .env
    restart: unless-stopped
    networks: [public]
    ports: ["5000:5000"]     # OK to keep for debugging; optional with Caddy
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import socket; socket.create_connection(('127.0.0.1',5000),2).close()\"" ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  public:
    external: true
