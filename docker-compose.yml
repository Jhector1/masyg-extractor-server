version: "3.9"

services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: masyg-extractor-app
    env_file: .env
    restart: unless-stopped
    networks: [public]
    expose:
      - "5000"
    # wget is available in python:3.12-slim, curl usually isn't
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  public:
    external: true
