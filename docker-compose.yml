services:
  masyg-extractor-app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: masyg-extractor-app

    env_file:
      - ${ENV_FILE:-masyg_extractor/.env}

    restart: unless-stopped

    networks:
      - public

    ports:
      - "5000:5000"

    healthcheck:
      test: >-
        python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5).read()"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  public:
    external: true
