services:
  masyg-extractor-app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: masyg-extractor-app

    env_file:
      - ${ENV_FILE:-masyg_extractor/.env}

    restart: unless-stopped
    init: true
    stop_grace_period: 30s

    networks:
      - public

    # Keep the API reachable from the host/reverse proxy without exposing
    # port 5000 directly on the public interfaces.
    ports:
      - "127.0.0.1:5000:5000"

    healthcheck:
      test: >-
        python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5).read()"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

networks:
  public:
    external: true
